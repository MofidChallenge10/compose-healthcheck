[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="compose-healthcheck"
version="0.1.0"
description="Static Docker Compose readiness audit"
requires-python=">=3.10"
license={text="MIT"}
[project.optional-dependencies]
yaml=["PyYAML>=6"]
[project.scripts]
compose-healthcheck="compose_healthcheck:main"
[tool.setuptools]
package-dir={""="src"}
py-modules=["compose_healthcheck"]
